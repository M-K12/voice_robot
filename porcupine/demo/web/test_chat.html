<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天窗口测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        input {
            width: 70%;
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #5568d3;
        }
        .info {
            margin: 10px 0;
            padding: 10px;
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
        }
        .error {
            margin: 10px 0;
            padding: 10px;
            background: #ffebee;
            border-left: 4px solid #f44336;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>聊天窗口测试</h1>
    
    <div class="controls">
        <label>聊天服务 URL:</label><br><br>
        <input 
            type="text" 
            id="chatUrl" 
            value="http://127.0.0.1:18789/#token=0d5aa4d6fbf114aac5ae1d92a630735bcd3731b9b34b1fba"
        >
        <button onclick="loadChat()">加载聊天窗口</button>
        <button onclick="testUrl()">测试 URL</button>
    </div>
    
    <div id="info"></div>
    
    <iframe id="chatFrame" src=""></iframe>
    
    <script>
        function showInfo(message, isError = false) {
            const div = document.getElementById('info');
            div.className = isError ? 'error' : 'info';
            div.innerHTML = message;
        }
        
        function loadChat() {
            const url = document.getElementById('chatUrl').value;
            const frame = document.getElementById('chatFrame');
            
            showInfo(`正在加载: ${url}`);
            frame.src = url;
            
            // 监听加载事件
            frame.onload = function() {
                showInfo(`✅ 成功加载: ${url}`);
            };
            
            frame.onerror = function() {
                showInfo(`❌ 加载失败: ${url}`, true);
            };
        }
        
        async function testUrl() {
            const url = document.getElementById('chatUrl').value;
            showInfo(`正在测试连接: ${url}`);
            
            try {
                // 尝试 fetch 请求
                const response = await fetch(url, { 
                    method: 'GET',
                    mode: 'no-cors' // 避免 CORS 错误
                });
                
                showInfo(`✅ 服务器响应正常<br>URL: ${url}<br>可以尝试加载聊天窗口`);
                
            } catch (error) {
                showInfo(`❌ 连接失败: ${error.message}<br><br>可能的原因:<br>
                    1. 聊天服务未启动<br>
                    2. 端口号不正确<br>
                    3. URL 格式错误<br>
                    4. 防火墙阻止连接`, true);
            }
        }
        
        // 页面加载时显示提示
        window.onload = function() {
            showInfo('请点击"测试 URL"检查聊天服务是否可用，然后点击"加载聊天窗口"');
        };
    </script>
</body>
</html>
