[project]
name = "voice-robot"
version = "1.0.0"
description = "Voice Robot — Tauri v2 + Vue 3 + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pydantic>=2.0",
    "websockets<14",
    "dashscope>=1.25.15",
    "numpy<2.0.0,>=1.26.0",
    "sherpa-onnx>=1.12.34",
    "onnxruntime>=1.20.0",
    "sounddevice>=0.5.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "colorama>=0.4.0",
    "sentencepiece>=0.2.0",
    "python-multipart>=0.0.32",
    "pypinyin>=0.50.0",
    "pytz>=2024.1",
    "pillow>=10.0.0",
    "PySide6>=6.6.0",
    "PySide6-Fluent-Widgets>=1.11.0",
    "loguru>=0.7.2",
    "keyboard>=0.13.5",
    "setuptools>=68.0.0",
    "cython>=3.0.0",
    "pyinstaller>=6.0.0",
]

[tool.uv]
dev-dependencies = []

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
