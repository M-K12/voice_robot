[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
anyhow = "1.0"
cpal = "0.15"
sherpa-onnx = "1.13.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# ── 生产打包极速启动与二进制深度裁剪优化 ──
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

